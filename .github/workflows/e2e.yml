name: E2E

on:
  push:
  pull_request:

jobs:
  playwright:
    name: Playwright (headless Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # The IRM edge-case specs run on chromium + webkit + firefox, and
          # this job's `test:e2e` invocation loads the same playwright.config.ts,
          # so all three engines must be installed here too.
          key: ${{ runner.os }}-playwright-multibrowser-${{ hashFiles('bun.lockb', 'package.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium webkit firefox

      - name: Install system deps for cached browsers
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium webkit firefox


      # The dev server is started automatically by playwright.config.ts
      # (webServer: bun run dev on http://localhost:8080).
      - name: Run Playwright tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  irm-simulator:
    name: IRM Simulator E2E (focused)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write


    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Bump the cache key when the browser list changes so WebKit/Firefox
          # aren't served from a stale Chromium-only cache.
          key: ${{ runner.os }}-playwright-multibrowser-${{ hashFiles('bun.lockb', 'package.json') }}

      # The IRM edge-case specs run on chromium + webkit + firefox (see the
      # `irm-edge-cases-*` projects in playwright.config.ts) to keep
      # keyboard-only correction feedback accessible across engines.
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium webkit firefox

      - name: Install system deps for cached browsers
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium webkit firefox


      - name: Run IRM simulator E2E tests
        run: bun run test:e2e:irm

      # Playwright's `retain-on-failure` keeps per-attempt artifacts for every
      # failed retry. For most specs we only care about the FINAL attempt (the
      # one that decided the run), so we prune earlier `-retryN` siblings and
      # keep the highest-numbered attempt folder per test.
      #
      # EXCEPTION: the `irm-edge-cases` Playwright project (IRM risk-scoring
      # edge-case specs) is configured with extra retries + `on-all-retries`
      # trace/video, precisely so flaky failures stay debuggable across every
      # attempt. Skip those folders here so all retry artifacts are preserved.
      - name: Prune non-final retry artifacts
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d test-results ]; then
            echo "No test-results directory; nothing to prune."
            exit 0
          fi
          declare -A best_n=()
          declare -A best_dir=()
          # Enumerate top-level per-test folders only.

          while IFS= read -r -d '' dir; do
            name="$(basename "$dir")"
            # Preserve every attempt for the dedicated edge-case project.
            if [[ "$name" == irm-edge-cases-* ]]; then
              echo "Preserving all attempts for edge-case folder: $dir"
              continue
            fi
            if [[ "$name" =~ ^(.*)-retry([0-9]+)$ ]]; then
              base="${BASH_REMATCH[1]}"
              n="${BASH_REMATCH[2]}"
            else
              base="$name"
              n=0
            fi

            cur="${best_n[$base]:-}"
            if [ -z "$cur" ] || [ "$n" -gt "$cur" ]; then
              best_n[$base]="$n"
              best_dir[$base]="$dir"
            fi
          done < <(find test-results -mindepth 1 -maxdepth 1 -type d -print0)

          keep=()
          for base in "${!best_dir[@]}"; do
            keep+=("${best_dir[$base]}")
          done
          printf 'Keeping final-attempt folder: %s\n' "${keep[@]}"

          while IFS= read -r -d '' dir; do
            name="$(basename "$dir")"
            # Never prune the edge-case project — every retry is kept.
            if [[ "$name" == irm-edge-cases-* ]]; then
              continue
            fi
            drop=1
            for k in "${keep[@]}"; do
              if [ "$dir" = "$k" ]; then drop=0; break; fi
            done
            if [ "$drop" = "1" ]; then
              echo "Pruning superseded attempt: $dir"
              rm -rf "$dir"
            fi
          done < <(find test-results -mindepth 1 -maxdepth 1 -type d -print0)




      # Per-browser debug bundles: one artifact per irm-edge-cases-<browser>
      # project so failures on Chromium, WebKit, and Firefox stay isolated.
      # Playwright names each per-test folder with its project prefix
      # (e.g. `test-results/irm-edge-cases-webkit-...-retry2/`), so a glob
      # on that prefix yields only that engine's traces/videos/screenshots.
      - name: Upload IRM failure debug bundle (chromium)
        id: upload-debug-chromium
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-irm-failure-debug-chromium
          path: |
            test-results/irm-edge-cases-chromium-*/**/trace.zip
            test-results/irm-edge-cases-chromium-*/**/video.webm
            test-results/irm-edge-cases-chromium-*/**/*.png
            test-results/irm-edge-cases-chromium-*/**/error-context.md
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload IRM failure debug bundle (webkit)
        id: upload-debug-webkit
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-irm-failure-debug-webkit
          path: |
            test-results/irm-edge-cases-webkit-*/**/trace.zip
            test-results/irm-edge-cases-webkit-*/**/video.webm
            test-results/irm-edge-cases-webkit-*/**/*.png
            test-results/irm-edge-cases-webkit-*/**/error-context.md
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload IRM failure debug bundle (firefox)
        id: upload-debug-firefox
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-irm-failure-debug-firefox
          path: |
            test-results/irm-edge-cases-firefox-*/**/trace.zip
            test-results/irm-edge-cases-firefox-*/**/video.webm
            test-results/irm-edge-cases-firefox-*/**/*.png
            test-results/irm-edge-cases-firefox-*/**/error-context.md
          retention-days: 14
          if-no-files-found: ignore

      # Debug bundle for non-edge-case specs (chromium-only project + any
      # other failing IRM tests). Excludes the per-browser edge-case folders
      # above so those artifacts aren't duplicated here.
      - name: Upload IRM failure debug bundle (other)
        id: upload-debug
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-irm-failure-debug-other
          path: |
            playwright-report
            test-results/**/trace.zip
            test-results/**/video.webm
            test-results/**/*.png
            test-results/**/error-context.md
            !test-results/irm-edge-cases-*/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload IRM Playwright report
        id: upload-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-irm
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore


      # Post (or update) a sticky PR comment linking the failed IRM test
      # artifacts so reviewers can jump straight to trace.zip / video /
      # screenshots / HTML report without digging through the Actions UI.
      - name: Comment on PR with failed IRM artifact links
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DEBUG_CHROMIUM_URL: ${{ steps.upload-debug-chromium.outputs.artifact-url }}
          DEBUG_WEBKIT_URL: ${{ steps.upload-debug-webkit.outputs.artifact-url }}
          DEBUG_FIREFOX_URL: ${{ steps.upload-debug-firefox.outputs.artifact-url }}
          DEBUG_OTHER_URL: ${{ steps.upload-debug.outputs.artifact-url }}
          REPORT_ARTIFACT_URL: ${{ steps.upload-report.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- irm-e2e-artifacts -->';
            const perBrowser = [
              { name: 'Chromium', project: 'irm-edge-cases-chromium', url: process.env.DEBUG_CHROMIUM_URL },
              { name: 'WebKit', project: 'irm-edge-cases-webkit', url: process.env.DEBUG_WEBKIT_URL },
              { name: 'Firefox', project: 'irm-edge-cases-firefox', url: process.env.DEBUG_FIREFOX_URL },
            ];
            const otherUrl = process.env.DEBUG_OTHER_URL || '';
            const reportUrl = process.env.REPORT_ARTIFACT_URL || '';
            const runUrl = process.env.RUN_URL;
            const body = [
              marker,
              '### ❌ IRM Simulator E2E failed',
              '',
              `**Run:** [#${context.runNumber}](${runUrl}) · commit \`${context.sha.slice(0, 7)}\``,
              '',
              '**Per-browser failure debug bundles** (trace.zip · video.webm · screenshots · error-context.md — 14d):',
              ...perBrowser.map(({ name, project, url }) =>
                url
                  ? `- **${name}** (${project}): [download debug bundle](${url})`
                  : `- **${name}** (${project}): _not produced_`
              ),
              '',
              '**Other IRM failures** (non edge-case specs — 14d):',
              otherUrl ? `- [playwright-irm-failure-debug-other](${otherUrl})` : '- _not produced_',
              '',
              '**Full Playwright HTML report** (7d):',
              reportUrl ? `- [playwright-report-irm](${reportUrl})` : '- _not produced_',
              '',
              `<sub>Browse per-test folders under \`test-results/\` inside the run: ${runUrl}</sub>`,
            ].join('\n');


            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }


