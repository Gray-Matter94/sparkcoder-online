name: E2E

on:
  push:
  pull_request:

jobs:
  playwright:
    name: Playwright (headless Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lockb', 'package.json') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install system deps for cached browser
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      # The dev server is started automatically by playwright.config.ts
      # (webServer: bun run dev on http://localhost:8080).
      - name: Run Playwright tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  irm-simulator:
    name: IRM Simulator E2E (focused)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write


    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lockb', 'package.json') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install system deps for cached browser
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run IRM simulator E2E tests
        run: bun run test:e2e:irm

      # Playwright's `retain-on-failure` keeps per-attempt artifacts for every
      # failed retry. We only care about the FINAL attempt (the one that
      # decided the run), so prune earlier `-retryN` siblings and keep the
      # highest-numbered attempt folder per test. The base (no suffix) folder
      # is attempt 1; `-retry1`, `-retry2`, ... are later attempts.
      - name: Prune non-final retry artifacts
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d test-results ]; then
            echo "No test-results directory; nothing to prune."
            exit 0
          fi
          declare -A best_n=()
          declare -A best_dir=()
          # Enumerate top-level per-test folders only.
          while IFS= read -r -d '' dir; do
            name="$(basename "$dir")"
            if [[ "$name" =~ ^(.*)-retry([0-9]+)$ ]]; then
              base="${BASH_REMATCH[1]}"
              n="${BASH_REMATCH[2]}"
            else
              base="$name"
              n=0
            fi
            cur="${best_n[$base]:-}"
            if [ -z "$cur" ] || [ "$n" -gt "$cur" ]; then
              best_n[$base]="$n"
              best_dir[$base]="$dir"
            fi
          done < <(find test-results -mindepth 1 -maxdepth 1 -type d -print0)

          keep=()
          for base in "${!best_dir[@]}"; do
            keep+=("${best_dir[$base]}")
          done
          printf 'Keeping final-attempt folder: %s\n' "${keep[@]}"

          while IFS= read -r -d '' dir; do
            drop=1
            for k in "${keep[@]}"; do
              if [ "$dir" = "$k" ]; then drop=0; break; fi
            done
            if [ "$drop" = "1" ]; then
              echo "Pruning superseded attempt: $dir"
              rm -rf "$dir"
            fi
          done < <(find test-results -mindepth 1 -maxdepth 1 -type d -print0)

      # Debug bundle for any failing IRM test: HTML report + per-test
      # trace.zip / video.webm / screenshot.png (retain-on-failure in
      # playwright.config.ts). Only the final retry attempt's artifacts
      # remain after the prune step above.

      - name: Upload IRM failure debug bundle
        id: upload-debug
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-irm-failure-debug
          path: |
            playwright-report
            test-results/**/trace.zip
            test-results/**/video.webm
            test-results/**/*.png
            test-results/**/error-context.md
          retention-days: 14
          if-no-files-found: warn

      - name: Upload IRM Playwright report
        id: upload-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-irm
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

      # Post (or update) a sticky PR comment linking the failed IRM test
      # artifacts so reviewers can jump straight to trace.zip / video /
      # screenshots / HTML report without digging through the Actions UI.
      - name: Comment on PR with failed IRM artifact links
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DEBUG_ARTIFACT_URL: ${{ steps.upload-debug.outputs.artifact-url }}
          REPORT_ARTIFACT_URL: ${{ steps.upload-report.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- irm-e2e-artifacts -->';
            const debugUrl = process.env.DEBUG_ARTIFACT_URL || '';
            const reportUrl = process.env.REPORT_ARTIFACT_URL || '';
            const runUrl = process.env.RUN_URL;
            const body = [
              marker,
              '### ❌ IRM Simulator E2E failed',
              '',
              `**Run:** [#${context.runNumber}](${runUrl}) · commit \`${context.sha.slice(0, 7)}\``,
              '',
              '**Failure debug bundle** (trace.zip · video.webm · screenshots · error-context.md · HTML report — 14d):',
              debugUrl ? `- [playwright-irm-failure-debug](${debugUrl})` : '- _not produced_',
              '',
              '**Full Playwright HTML report** (7d):',
              reportUrl ? `- [playwright-report-irm](${reportUrl})` : '- _not produced_',
              '',
              `<sub>Browse per-test folders under \`test-results/\` inside the run: ${runUrl}</sub>`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }


