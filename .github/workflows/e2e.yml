name: E2E

on:
  push:
  pull_request:

jobs:
  playwright:
    name: Playwright (headless Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lockb', 'package.json') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install system deps for cached browser
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      # The dev server is started automatically by playwright.config.ts
      # (webServer: bun run dev on http://localhost:8080).
      - name: Run Playwright tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  irm-simulator:
    name: IRM Simulator E2E (focused)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lockb', 'package.json') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install system deps for cached browser
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run IRM simulator E2E tests
        run: bun run test:e2e:irm

      # Debug bundle for any failing IRM test: HTML report + per-test
      # trace.zip / video.webm / screenshot.png (retain-on-failure in
      # playwright.config.ts). Uploaded on failure only so green runs
      # stay artifact-light.
      - name: Upload IRM failure debug bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-irm-failure-debug
          path: |
            playwright-report
            test-results/**/trace.zip
            test-results/**/video.webm
            test-results/**/*.png
            test-results/**/error-context.md
          retention-days: 14
          if-no-files-found: warn

      - name: Upload IRM Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-irm
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

